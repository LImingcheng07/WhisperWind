name: publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        default: 'manual'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore + Publish (self-contained win-x64)
        run: >
          dotnet publish src/WhisperWind.App/WhisperWind.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -p:EnableCompressionInSingleFile=true
          -o publish/win-x64

      - name: Verify build artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path publish/win-x64 | Select-Object Name, Length | Format-Table -AutoSize
          $size = (Get-Item publish/win-x64/WhisperWind.App.exe).Length
          Write-Host "Exe size: $([math]::Round($size/1MB, 2)) MB"

      - name: Zip artifact
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -eq "" -or $version -eq "refs/heads/main") {
            $version = "${{ inputs.version }}"
          }
          if ($version -eq "manual") { $version = "dev" }
          $zip = "WhisperWind-$version-win-x64.zip"
          Compress-Archive -Path publish/win-x64/* -DestinationPath $zip -Force
          Write-Host "Zipped: $zip"
          Write-Host "Zipped size: $([math]::Round((Get-Item $zip).Length/1MB, 2)) MB"

      - name: Create / Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WhisperWind-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: WhisperWind-win-x64
          path: WhisperWind-*.zip
          if-no-files-found: error
